<div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Contact Us</h2>
  
            <form  novalidate>
  
              <!-- Name -->
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" class="form-control" formControlName="name" placeholder="Your Name" />
                <div class="text-danger mt-1" *ngIf="">
                  Name is required.
                </div>
              </div>
  
              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" formControlName="email" placeholder="you@example.com" />
                <div class="text-danger mt-1" *ngIf="">
                  Enter a valid email.
                </div>
              </div>
  
              <!-- Message -->
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" rows="5" class="form-control" formControlName="message" placeholder="Your message..."></textarea>
                <div class="text-danger mt-1" *ngIf="">
                  Message is required.
                </div>
              </div>
  
              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary" >
                  Send Message
                </button>
              </div>
  
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
