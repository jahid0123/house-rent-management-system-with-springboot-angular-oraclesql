<div class="container py-5">
    <div class="row g-4 justify-content-center">
  
      <!-- Package Card -->
      <div class="col-md-4" *ngFor="let pkg of packages">
        <div class="card border-0 shadow-lg h-100 text-center package-card">
          <div class="card-body p-4">
            <h4 class="fw-bold mb-2">{{ pkg.name }}</h4>
            <div class="mb-2">
              <i class="bi bi-box-seam fs-3 text-primary"></i>
            </div>
            <p class="fw-bold mb-1"><strong>{{ pkg.credit }} Credit</strong></p>
            <p class="text-success">Bonus: {{ pkg.bonus }}</p>
            <p class="text-muted"><i class="bi bi-infinity"></i> Unlimited Validity</p>
            <h5 class="text-primary fw-bold mt-2">Price: {{ pkg.price }} BDT</h5>
          </div>
          <div class="card-footer bg-transparent border-0 mb-3">
            <button class="btn btn-gradient w-75">Buy</button>
          </div>
        </div>
      </div>
  
    </div>
  </div>
